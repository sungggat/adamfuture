services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/adamfuture.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    command: >-
      /bin/sh -c "while :; do sleep 6h; nginx -s reload; done &
      exec nginx -g 'daemon off;'"

  certbot-renew:
    image: certbot/certbot:v4.0.0
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
