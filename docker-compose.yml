services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adam
      POSTGRES_USER: adam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adam -d adam"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://adam:${POSTGRES_PASSWORD}@postgres:5432/adam
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      PRIVACY_SECRET: ${PRIVACY_SECRET:?set PRIVACY_SECRET in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      REPORTS_DIR: /data/reports
      MAX_REPORT_BYTES: ${MAX_REPORT_BYTES:-15728640}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres: { condition: service_healthy }
      reports-init: { condition: service_completed_successfully }
    volumes:
      - reports_data:/data/reports
    networks: [database, app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  reports-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data/reports && chown -R 65532:65532 /data/reports && chmod 750 /data/reports"]
    volumes:
      - reports_data:/data/reports
    networks: [app]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [app]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx/adamfuture.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_healthy }
    networks: [app]

  certbot:
    image: certbot/certbot:v4.0.0
    profiles: [tls]
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  certbot_webroot:
  letsencrypt:
  reports_data:

networks:
  app:
  database:
    internal: true
