limit_req_zone $binary_remote_addr zone=assessment_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/m;

server {
  listen 80;
  server_name adamfuture.kz www.adamfuture.kz;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / { return 301 https://adamfuture.kz$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name adamfuture.kz www.adamfuture.kz;

  ssl_certificate /etc/letsencrypt/live/adamfuture.kz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/adamfuture.kz/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/adamfuture.kz/chain.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  client_max_body_size 128k;
  client_body_timeout 10s;
  keepalive_timeout 30s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

  location = /api/assessments {
    limit_req zone=assessment_limit burst=3 nodelay;
    limit_except POST { deny all; }
    proxy_pass http://backend:8000/assessments;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
  }

  location /api/admin/ {
    limit_req zone=admin_limit burst=10 nodelay;
    proxy_pass http://backend:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "no-store" always;
  }

  location = /api/health {
    proxy_pass http://backend:8000/health;
    access_log off;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
